[package]
name = "dictafone"
version = "0.1.0"
description = "A super simple dictaphone"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
mp3lame-encoder = "0.2"
chrono = "0.4"
